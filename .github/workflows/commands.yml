name: Update command reference

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'scripts/generate-commands.sh'
      - 'scripts/commit-generated-docs.sh'
      - '.github/workflows/commands.yml'
      - 'docs/COMMANDS.md'
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    container: rust:1.96
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # act --bind supplies the local workspace without a GitHub checkout/token.
      - uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.ref_name }}

      - name: Generate Markdown from CLI help
        run: bash scripts/generate-commands.sh

      # act checks generation locally without committing or pushing.
      - name: Commit updated reference
        if: ${{ env.ACT != 'true' }}
        run: |
          bash scripts/commit-generated-docs.sh 'docs: update command reference from CLI help' docs/COMMANDS.md
