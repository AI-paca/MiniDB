name: Update command reference

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'scripts/generate-commands.sh'
      - '.github/workflows/commands.yml'
      - 'docs/COMMANDS.md'
  workflow_dispatch:

concurrency:
  group: commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commands:
    runs-on: ubuntu-latest
    container: rust:1.96
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # act --bind supplies the local workspace without a GitHub checkout/token.
      - uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.ref_name }}

      - name: Generate Markdown from CLI help
        run: bash scripts/generate-commands.sh

      # act checks generation locally without committing or pushing.
      - name: Commit updated reference
        if: ${{ env.ACT != 'true' }}
        run: |
          git add -- docs/COMMANDS.md
          if git diff --cached --quiet -- docs/COMMANDS.md; then
            echo 'Command reference is up to date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: update command reference from CLI help'
          git push origin "HEAD:${GITHUB_REF_NAME}"
