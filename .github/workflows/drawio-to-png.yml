name: Update PNG from Drawio

on:
  push:
    branches: ['**']
    paths:
      - '**/*.drawio'
      - 'scripts/render-diagrams.sh'
      - 'scripts/update-diagrams-readme.py'
      - 'scripts/commit-generated-docs.sh'
      - '.github/workflows/drawio-to-png.yml'
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # act --bind supplies local files and never publishes a commit.
      - uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.ref_name }}

      - name: Export drawio and update README
        run: bash scripts/render-diagrams.sh

      - name: Commit rendered diagrams
        if: ${{ env.ACT != 'true' }}
        run: |
          bash scripts/commit-generated-docs.sh 'docs: render diagrams' README.md diagrams
